substitutions:
  _REGION: asia-northeast3
  _ENVIRONMENT: staging
  _SERVICE: qr-order-staging
  _REPOSITORY: qr-order
  _FRONTEND_API_BASE_URL: ''

steps:
  - id: backend-tests
    name: gradle:8.14.4-jdk21
    dir: qr-order-backend
    entrypoint: bash
    args:
      - -c
      - |
        ./gradlew --no-daemon test
        result=$$?
        if [ "$$result" -ne 0 ]; then
          # Preserve the full connection error and load-test measurements in CI logs.
          cat build/test-results/test/TEST-*.xml
        fi
        exit "$$result"

  - id: frontend-install
    name: node:22.12.0
    dir: qr-order-frontend
    entrypoint: npm
    args: ['ci']

  - id: frontend-checks
    name: node:22.12.0
    dir: qr-order-frontend
    entrypoint: bash
    args: ['-c', 'npm run test && npm run lint && VITE_API_BASE_URL="${_FRONTEND_API_BASE_URL}" npm run build']
    waitFor: ['frontend-install']

  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${SHORT_SHA}'
      - qr-order-backend
    waitFor: ['backend-tests']

  - id: push-backend-image
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${SHORT_SHA}']
    waitFor: ['build-backend-image']

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - '${_SERVICE}'
      - '--region=${_REGION}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${SHORT_SHA}'
      - '--quiet'
    waitFor: ['push-backend-image', 'frontend-checks']

  - id: smoke-health
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        SERVICE_URL="$(gcloud run services describe "${_SERVICE}" --region "${_REGION}" --format='value(status.url)')"
        curl --fail --retry 8 --retry-delay 5 "$${SERVICE_URL}/actuator/health/readiness"
        if [ "${_ENVIRONMENT}" = "staging" ]; then
          curl --fail --retry 3 --retry-delay 2 "$${SERVICE_URL}/v3/api-docs/customer"
        fi
    waitFor: ['deploy-backend']
  - id: deploy-frontend
    name: us-docker.pkg.dev/firebase-cli/us/firebase
    args:
      - deploy
      - --project=${PROJECT_ID}
      - --only=hosting
      - --non-interactive
    waitFor: [ 'smoke-health' ]

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
  # Run the HTTP server, PostgreSQL and 100 SSE clients plus concurrent orders
  # on a sized worker; the default worker exhausted the test's 3s DB pool wait.
  machineType: E2_HIGHCPU_8

timeout: 1800s
